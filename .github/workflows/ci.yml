name: CI & Endpoint Reachability Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily at 06:00 UTC to detect any Google Sheet / Apps Script drift
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Typecheck, Build & Verify Endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Build Vite production bundle
        run: npm run build

      - name: Verify Live Endpoints (Google Sheets CSV + Web App API)
        run: npm run test:reachability
